map $http_origin $cors_origin {
    default "";
    "http://example.com" "http://example.com";
    "https://example.com" "https://example.com";
    "http://localhost" "http://localhost";
    "http://localhost:3000" "http://localhost:3000";
}

server {
    listen 80;
    server_name example.com;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://docs:3000;
    }
}

server {
    listen 80;
    server_name api.example.com;

    # Companion headers are only meaningful in a preflight response.
    # $cors_origin is "" for unlisted origins; browsers treat an empty
    # Access-Control-Allow-Origin as denied (same effect as omitting it).
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Methods "GET,POST,OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type,Authorization";
        add_header Access-Control-Max-Age 86400;
        add_header Vary Origin;
        return 204;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8080;

        # Headers are here (not at server scope) so adding a header to this
        # location block in future does not silently drop them (nginx inheritance).
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Vary Origin always;
    }
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host api.example.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:8080;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host example.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://docs:3000;
    }
}
